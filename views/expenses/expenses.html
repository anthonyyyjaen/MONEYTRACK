<section id="expenses" class="content-section">
  <div class="section-header">
    <h2>Expenses</h2>
    <button id="add-expenses" class="btn btn-primary">
      <i class="fas fa-plus"></i> Add Expenses
    </button>
  </div>

  <div class="expenses-table">
    <div id="calendar"></div>
  </div>

  <div class="modal" id="add-expenses-modal">
    <div class="modal-content">
      <span id="close-modal" class="close-modal">&times;</span>
      <h2>Add Expenses</h2>
      <form id="add-expenses-form" autocomplete="off">
        <div class="form-group">
          <label for="selcategory"
            >Category <span class="required">*</span></label
          >
          <select id="selcategory" name="selcategory"></select>
        </div>

        <div class="form-group">
          <label for="txtexpensename"
            >Expense Name <span class="required">*</span></label
          >
          <input type="text" id="txtexpensename" name="txtexpensename" />
        </div>

        <div class="form-group">
          <label for="selpayinterval"
            >Pay Interval <span class="required">*</span></label
          >
          <select id="selpayinterval" name="selpayinterval"></select>
        </div>

        <div id="divstartdate" class="form-group" style="display: none">
          <label for="txtstartdate"
            >Start Date <span class="required">*</span></label
          >
          <input type="date" id="txtstartdate" name="txtstartdate" />
        </div>

        <div id="divenddate" class="form-group" style="display: none">
          <label for="txtenddate"
            >End Date <span class="required">*</span></label
          >
          <input type="date" id="txtenddate" name="txtenddate" />
        </div>

        <div id="divcustomday" class="form-group" style="display: none">
          <label for="txtcustomday"
            >Custom Day <span class="required">*</span></label
          >
          <input type="text" id="txtcustomday" name="txtcustomday" />
        </div>

        <div class="form-group">
          <label for="txtamount">Amount <span class="required">*</span></label>
          <input type="text" id="txtamount" name="txtamount" />
        </div>

        <button type="submit" class="btn btn-primary">Save Expenses</button>
      </form>
    </div>
  </div>

  <div class="modal" id="expenses-detail-modal">
    <div class="modal-content">
      <span id="close-modal" class="close-modal">&times;</span>
      <h2>Expenses Detail</h2>

      <div>
        <div id="dtl-category" class="text-muted small text-uppercase mb-1">
          CATEGORY
        </div>

        <h3 class="mb-0 fw-semibold d-flex align-items-center flex-wrap gap-2">
          <span id="dtl-expensename">EXPENSESNAME</span>

          <small id="dtl-expensecode" style="font-weight: lighter">
            (EXPENSESCODE)
          </small>
          <span id="dtl-status"></span>
        </h3>
      </div>

      <div class="expense-amounts">
        <div class="amount-item">
          <div class="amount-label">Total Amount</div>
          <div id="dtl-totalamount" class="amount-value"></div>
        </div>

        <div class="amount-item">
          <div class="amount-label">Total Paid</div>
          <div id="dtl-totalpaid" class="amount-value paid"></div>
        </div>

        <div class="amount-item">
          <div class="amount-label">Balance</div>
          <div id="dtl-balance" class="amount-value balance"></div>
        </div>
      </div>

      <hr />

      <div id="detail-timeline" class="timeline"></div>
    </div>
  </div>
</section>
